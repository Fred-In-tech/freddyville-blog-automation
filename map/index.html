ts national trend","detail":"Prefers a story with a concrete Houston sector, event or buyer-behaviour tie-in over a national trend with a local CTA bolted on.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:18"},{"id":"factguard","label":"No-fabrication rule","kind":"service","group":"Research & topic","detail":"Stats, quotes and product claims must come from the search results, with 1-2 real source URLs carried into the post.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:18"},{"id":"dedupe","label":"Archive dedupe check","kind":"service","group":"Research & topic","sub":"reads every existing post","detail":"Reads the whole archive before choosing, so no topic or slug repeats across dozens of prior runs.","sourceRef":"lib/blog-posts.js"},{"id":"topic","label":"Topic + slug decision","kind":"service","group":"Research & topic","detail":"One angle per run, with a keyword-rich kebab-case slug that has to be unique in the archive.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:25"},{"id":"draft","label":"Draft (700-1100 words)","kind":"service","group":"Draft & voice","detail":"Original commentary synthesised from the news, tied back to what it means for Houston brands.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:20"},{"id":"voicerules","label":"VOICE word lists","kind":"store","group":"Draft & voice","sub":"13 preferred / 14 banned","detail":"The brand voice is data, not vibes: an explicit preferred list and a hard banned list of hype words.","sourceRef":"lib/constants.js:507"},{"id":"voicegate","label":"Banned-word gate","kind":"service","group":"Draft & voice","detail":"Copy containing any banned word or phrase gets rewritten before it can ship.","sourceRef":"lib/constants.js:514"},{"id":"aeo","label":"AEO structure pass","kind":"service","group":"Draft & voice","sub":"answer-first, H2s, bullets","detail":"Opens with a direct 1-2 sentence answer, then H2 sections and at least one bulleted list so answer engines can extract and cite it.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:22"},{"id":"meta","label":"Post metadata","kind":"service","group":"Draft & voice","sub":"excerpt, cat, read, date","detail":"Meta-description excerpt, one of five categories, a realistic read time and today's date in the site's display format.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:24"},{"id":"unsplash","label":"Unsplash search","kind":"external","domain":"unsplash.com","group":"Image pipeline","detail":"Search page is fetched and a direct CDN photo URL is extracted; licence allows commercial use without attribution.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:26"},{"id":"curl","label":"curl download","kind":"tool","group":"Image pipeline","detail":"Pulls the candidate photo to a scratch path before anything is trusted.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:26"},{"id":"vision","label":"Visual match check","kind":"service","group":"Image pipeline","sub":"look at it, then decide","detail":"The agent actually views the downloaded image and rejects it if the subject or city does not match the post.","sourceRef":"scheduled-tasks/freddyville-daily-blog/SKILL.md:26"},{"id":"sips","label":"sips optimize","kind":"tool","group":"Image pipeline","sub":"JPEG q82, 1400px wide","detail":"Re-encodes to a fixed width and quality so page weight stays predictable across every post.","sourceRef":"public/images/blog/"},{"id":"imgstore","label":"Blog image store","kind":"store","group":"Image pipeline","detail":"Images are committed to the repo at a path derived from the slug, so the post and its hero can never drift apart.","sourceRef":"public/images/blog/\u003cslug>.jpg"},{"id":"postsfile","label":"POSTS data file","kind":"store","sub":"single ~470KB module","detail":"One array of post objects, newest first; the new object is inserted at index 0.","sourceRef":"lib/blog-posts.js:5"},{"id":"verify","label":"Parse + shape check","
